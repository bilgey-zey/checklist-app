<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <title>Offline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .box {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
    }

<body>
  <div class="box">
    <h1 id="offlineTitle">You are offline</h1>
    <p id="offlineBody">The app shell is available, but live server data is currently unavailable.</p>
  </div>
  <script type="module">
    import { applyOfflinePageTranslations } from "/js/i18n.js";
    applyOfflinePageTranslations();
  </script>
