<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <title id="pageTitle">My Checklists</title>
  <link rel="stylesheet" href="/css/todos.css">
</head>
<body>

  <div class="wrapper">

    <div class="card">

      <div class="card-header">
        <div>
          <h1 id="todosTitle" class="todos-title">My Checklists</h1>
          <p id="todosSubtitle" class="todos-subtitle">Create, complete and share your checklists with others.</p>
        </div>
        <div class="header-actions">
          <label class="lang-select-wrapper">
            <span class="sr-only">Language</span>
            <select id="langSelectTodos" class="lang-select">
              <option value="tr">Türkçe</option>
              <option value="en">English</option>
              <option value="no">Norsk</option>
            </select>
          </label>
          <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
        </div>
      </div>

      <nav class="tabs" aria-label="Checklist type">
        <button id="tabMine" class="tab tab--active" type="button">My checklists</button>
        <button id="tabShared" class="tab" type="button">Shared with me</button>
      </nav>

      <div class="add-section">
        <div class="sr-only">
          <label id="newTodoLabel" for="newTodo">New checklist title</label>
        </div>
        <input type="text" id="newTodo" placeholder="New checklist title" autocomplete="off">
        <button id="addBtn" type="button">Add</button>
      </div>

      <div id="emptyState" class="empty-state" aria-hidden="true">
        <p id="emptyTitle" class="empty-title">You don't have any checklists yet.</p>
        <p id="emptyText" class="empty-text">Use the field above to create your first checklist item.</p>
      </div>

      <div id="todoList" class="list" role="listbox" aria-label="Checklists"></div>

      <div class="share-section">
  <h3 id="shareTitle">Share Checklist</h3>

  <div class="sr-only">
    <label id="shareEmailLabel" for="shareEmail">User email</label>
  </div>
  <input type="email" id="shareEmail" placeholder="User email" autocomplete="email">

  <button id="shareBtn" type="button">Share all my checklists</button>
</div>

      <div id="liveRegion" class="sr-only" role="status" aria-live="polite"></div>

    </div>

  </div>

  <script type="module" src="/js/todos.js"></script>
  <script type="module" src="/js/register-sw.js"></script>
</body>
</html>
